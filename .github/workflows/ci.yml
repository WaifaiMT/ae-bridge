name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Tests fake After Effects, so they run anywhere; Windows is where the bridge is used.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
